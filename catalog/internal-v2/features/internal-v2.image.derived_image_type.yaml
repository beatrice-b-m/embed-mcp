kind: feature
label: Derived mammographic image-type classification
definition: >-
  Pipeline-derived classification of the mammographic acquisition form represented by one
  internal V1c image row.
value_type: coded
evidence: [observed_source_values, inference, maintainer_confirmed]
search_terms:
  - final image type
  - FFDM
  - tomosynthesis
  - DBT
  - synthetic 2D
  - C-view
  - derived image type
caveats:
  - >-
    The classification separates mammographic acquisition forms only; every non-mammographic
    source modality falls into the residual class.
  - >-
    It is not exhaustive: source image-type tokens equivalent to a named class also occur under
    the residual class.
  - >-
    ROI_SS and ROI_SSC are secondary screen-capture annotation-transfer artifacts retained
    solely for ROI extraction and are not intended for other use.
topics: [topic.imaging, topic.mammography]
cites:
  - internal-v2.v1c-metadata-context#image-type-distinctions
  - internal-v2.v1c-metadata-context#modality-surface
  - internal-v2.v1c-metadata-context#roi-screen-capture-purpose
objects: [image]
