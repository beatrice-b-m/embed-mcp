kind: feature
label: Source DICOM image-type attribute
definition: >-
  Serialized multi-valued source DICOM image-type attribute for one internal V1c image row.
value_type: categorical
evidence: [observed_source_values]
search_terms: [image type, DICOM image type, derived primary, original primary]
caveats:
  - >-
    The value is a serialized sequence of source tokens; its element count varies and empty
    elements occur.
  - Token meanings are source-system specific and are not interpreted here.
  - >-
    This attribute, not the derived classification, separates contrast-enhanced, stereotactic,
    post-biopsy, scout, and screen-save acquisitions.
topics: [topic.imaging]
cites:
  - internal-v2.v1c-metadata-context#image-type-distinctions
objects: [image]
