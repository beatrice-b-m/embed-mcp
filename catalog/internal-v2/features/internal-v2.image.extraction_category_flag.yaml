definition: Pipeline-assigned extraction category recorded on one internal V1c image row.
value_type: categorical
evidence: [observed_source_values, unresolved]
search_terms: [extraction category, no image category, pipeline category]
caveats:
  - >-
    The intended meaning of each represented value is not established, and the non-default value
