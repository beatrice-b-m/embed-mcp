kind: relationship
label: Patient has reported hormone or treatment history entry
relationship_type: hierarchy
definition: >-
  Patient ownership of each represented hormone, treatment, or contraceptive history entry
  through the established longitudinal patient identity.
cardinality:
  targets_per_source: zero_or_more
  sources_per_target: exactly_one
optionality:
  source: optional
  target: required
attribution_limitations:
  - No stable history-entry identity or semantic deduplication rule is established.
temporal_qualification: >-
  The relationship is longitudinal patient ownership and does not date the exposure.
search_terms: [patient hormone history, patient therapy history, patient contraceptive history]
caveats:
  - Repeated reports must not be silently treated as either distinct exposures or duplicates.
source_object: patient
target_object: internal-v2.hormone_history_entry
topics: [topic.identity, topic.procedure, topic.temporal]
cites:
  - internal-v2.patient-history-context#patient-and-accession-context
