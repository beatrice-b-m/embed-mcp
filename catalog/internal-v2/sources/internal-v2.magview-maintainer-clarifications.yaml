kind: source
label: Internal V2 MagView maintainer clarifications
source_type: maintainer_confirmed
locator_type: logical_artifact
locator: maintainer-confirmed:internal-v2-magview-clarifications
version_scope: >-
  Internal EMBED V2 patient identity, imaging-episode linkage, finding and procedure identity,
  date deidentification, procedure reliability, specimen uncertainty, categorical normalization,
  pathology severity, and registry linkage semantics.
notes:
  - >-
    Confirms that empi_anon persists across a patient's records within internal V2 and supports
    longitudinal traversal.
  - >-
    Confirms that linked accessions are explicitly linked co-occurring exams in one imaging
    episode and never prior or follow-up exams.
  - >-
    Confirms accession-plus-finding-number clinical finding identity, the synthetic
    contralateral negative finding-number representation, per-patient date shifting, age
    derivation and top-coding, exam and procedure event-date meanings, procedure identity within
    a patient by procedure date, type, and biopsy side, specimen-level uncertainty, supported
    code normalization, code-5 meaning, invalid code-6 handling, and cancer-registry reference
    semantics.
  - >-
    Confirms that every exam-level field is invariant across repeated rows for one accession and
    that conflicting repeated values are data-quality errors.
