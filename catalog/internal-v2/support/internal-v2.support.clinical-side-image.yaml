evidence_summary: >-
  The breast-side-to-image relationship is physically bound between the internal MagView finding
  side and the internal V1c derived final image laterality on the same accession, with bilateral
  finding sides projected to both left and right.
evidence_caveats:
  - Coverage is that of internal V1c, which is narrower than clinical V2.
  - An image without a derived final laterality has no side projection.
