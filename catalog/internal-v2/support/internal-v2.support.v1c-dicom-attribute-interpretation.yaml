kind: profile_support
representation_status: unresolved
representation_summary: >-
  Internal V1c columns parsed directly from DICOM carry standard element semantics and received
  no processing beyond anonymization; many acquisition, dose, detector, collimator, geometry,
  windowing, icon-image, order-number, and time-of-day columns are not mapped to features.
representation_caveats:
  - An unmapped DICOM column still carries its standard DICOM element meaning.
  - >-
    Pipeline-derived fields require separate evidence, and anonymization of DICOM time-of-day
    attributes remains unknown.
search_terms:
  - unmapped DICOM attributes
  - acquisition parameters
  - DICOM time of day
  - uninterpreted image columns
subject: internal-v2.v1c-metadata-context
topics: [topic.imaging, topic.technical]
representation_cites:
  - internal-v2.v1c-metadata-context#parsed-dicom-element-semantics
  - internal-v2.v1c-metadata-context#dicom-demographic-anonymization
