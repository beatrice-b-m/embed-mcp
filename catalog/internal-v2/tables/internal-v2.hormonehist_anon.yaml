kind: table
label: HormoneHist_anon
grain: >-
  one source history record; clinical-entry identity and rows per historical event remain
  unresolved
caveats:
  - >-
    Physical types are parse types rather than source-declared types; comment is a free-text
    string.
  - >-
    No embedded schema or nullability contract is supplied; every column is conservatively
    nullable, independently of observed missingness.
  - >-
    Text padding and blank strings are physical representations, not global missing-value or
    normalization rules.
  - No unique row identity, deduplication rule, or cross-table match coverage is established.
keys:
  patient-grouping:
    key_type: technical
    uniqueness: not_unique
    completeness: unknown
    evidence: [observed_source_values]
    caveats:
      - >-
        A grouping within which attributes vary; it is not a unique history-row or
        clinical-entry identity.
      - Its completeness, sentinel values, and longitudinal history identity are not established.
    columns: [empi_anon]
  exam-grouping:
    key_type: technical
    uniqueness: not_unique
    completeness: unknown
    evidence: [observed_source_values]
    caveats:
      - >-
        A grouping within which attributes vary; it is not a unique history-row or
        clinical-entry identity.
      - Its completeness, sentinel values, and longitudinal history identity are not established.
    columns: [acc_anon]
objects:
  patient:
    completeness: partial
    authority: reference
    derivation: projected
    caveats:
      - >-
        This is a repeated contextual projection; no history-entry or historical-event identity
        is asserted.
    object: patient
    cites:
      - internal-v2.patient-history-context#patient-and-accession-context
      - internal-v2.history-topology-context#tested-groupings
    columns: [empi_anon]
  imaging_exam:
    completeness: partial
    authority: reference
    derivation: projected
    caveats:
      - >-
        This is a repeated contextual projection; no history-entry or historical-event identity
        is asserted.
    object: imaging_exam
    cites:
      - internal-v2.patient-history-context#patient-and-accession-context
      - internal-v2.history-topology-context#tested-groupings
    columns: [acc_anon]
  internal-v2.hormone_history_entry:
    completeness: partial
    authority: reference
    derivation: source
    caveats:
      - >-
        The table carries reported history; no instance identity, event uniqueness, or
        deduplication rule is established.
      - >-
        Complete physical inventory does not imply complete clinical capture or that every
        column has a supported semantic mapping.
    object: internal-v2.hormone_history_entry
    cites:
      - internal-v2.patient-history-context#reported-history-not-current-care
      - internal-v2.history-topology-context#physical-inventories
      - internal-v2.history-topology-context#tested-groupings
    columns:
      - type
      - code
      - side
      - first_age
      - last_age
      - continuous
      - current
      - duration
      - mfirst
      - yfirst
      - mlast
      - ylast
      - empi_anon
      - acc_anon
      - comment
columns:
  type:
    type: string
    nullable: true
    maps:
      - id: internal-v2.hormone_history.exposure_category
        mapping: direct
        vocabulary: internal-v2.codes.hormone-history-exposure-category
  code:
    type: string
    nullable: true
    maps:
      - id: internal-v2.hormone_history.hormone_code
        mapping: conditional
        vocabulary: internal-v2.codes.hormone-history-hormone
        category_column: type
        category_value: H
      - id: internal-v2.hormone_history.therapy_code
        mapping: conditional
        vocabulary: internal-v2.codes.hormone-history-therapy
        category_column: type
        category_value: T
      - id: internal-v2.hormone_history.contraceptive_code
        mapping: conditional
        vocabulary: internal-v2.codes.hormone-history-contraceptive
        category_column: type
        category_value: O
    interpretations:
      ORAL or TAXOL under H:
        representation: ORAL or TAXOL under H
        represented_values: [ORAL, TAXOL]
        meaning: >-
          Observed category/code combinations outside the supported occurrence-specific
          dictionary; meanings remain unresolved
        status: unresolved
        cites:
          - internal-v2.history-topology-context#hormone-category-discrepancies
        feature: internal-v2.hormone_history.hormone_code
      ORAL under T:
        representation: ORAL under T
        represented_values: [ORAL]
        meaning: >-
          Observed category/code combinations outside the supported occurrence-specific
          dictionary; meanings remain unresolved
        status: unresolved
        cites:
          - internal-v2.history-topology-context#hormone-category-discrepancies
        feature: internal-v2.hormone_history.therapy_code
  side:
    type: string
    nullable: true
  first_age:
    type: string
    nullable: true
    maps:
      - id: internal-v2.hormone_history.reported_start_age
        mapping: direct
        notes:
          - >-
            The physical field remains string despite numeric temporal meaning; no exact-date
            construction, sentinel rule, or precedence is supplied.
  last_age:
    type: string
    nullable: true
    maps:
      - id: internal-v2.hormone_history.reported_end_age
        mapping: direct
        notes:
          - >-
            The physical field remains string despite numeric temporal meaning; no exact-date
            construction, sentinel rule, or precedence is supplied.
  continuous:
    type: string
    nullable: true
    maps:
      - {id: internal-v2.hormone_history.continuous_status, mapping: direct}
    interpretations:
      "Y, N, or blank string":
        representation: Y, N, or blank string
        represented_values: [Y, N, ""]
        meaning: >-
          Observed reported-status encodings; blank-to-negative equivalence is not established
        status: reconciled
        caveats: [No exact interval endpoint is supplied.]
        cites:
          - internal-v2.history-topology-context#hormone-status-representation
  current:
    type: string
    nullable: true
    maps:
      - {id: internal-v2.hormone_history.current_status, mapping: direct}
    interpretations:
      "Y, N, or blank string":
        representation: Y, N, or blank string
        represented_values: [Y, N, ""]
        meaning: >-
          Observed reported-status encodings; blank-to-negative equivalence is not established
        status: reconciled
        caveats: [No exact interval endpoint is supplied.]
        cites:
          - internal-v2.history-topology-context#hormone-status-representation
  duration:
    type: int64
    nullable: true
    maps:
      - id: internal-v2.hormone_history.reported_duration
        mapping: direct
        notes:
          - >-
            The int64 type is a parse type and establishes neither duration units nor
            zero-as-missing semantics.
  mfirst:
    type: string
    nullable: true
    maps:
      - id: internal-v2.hormone_history.reported_start_month
        mapping: direct
        notes:
          - >-
            The physical field remains string despite numeric temporal meaning; no exact-date
            construction, sentinel rule, or precedence is supplied.
  yfirst:
    type: string
    nullable: true
    maps:
      - id: internal-v2.hormone_history.reported_start_year
        mapping: direct
        notes:
          - >-
            The physical field remains string despite numeric temporal meaning; no exact-date
            construction, sentinel rule, or precedence is supplied.
  mlast:
    type: string
    nullable: true
    maps:
      - id: internal-v2.hormone_history.reported_end_month
        mapping: direct
        notes:
          - >-
            The physical field remains string despite numeric temporal meaning; no exact-date
            construction, sentinel rule, or precedence is supplied.
  ylast:
    type: string
    nullable: true
    maps:
      - id: internal-v2.hormone_history.reported_end_year
        mapping: direct
        notes:
          - >-
            The physical field remains string despite numeric temporal meaning; no exact-date
            construction, sentinel rule, or precedence is supplied.
  empi_anon:
    type: int64
    nullable: true
    maps:
      - {id: identity.patient_identifier, mapping: direct}
    interpretations:
      represented identifier:
        representation: represented identifier
        meaning: Established patient namespace for the history owner
        status: verified
        caveats:
          - >-
            Candidate accession sentinel behavior and cross-table match coverage remain
            unresolved.
        cites:
          - internal-v2.patient-history-context#patient-and-accession-context
  acc_anon:
    type: int64
    nullable: true
    maps:
      - {id: exam.accession_identifier, mapping: direct}
    interpretations:
      represented identifier:
        representation: represented identifier
        meaning: >-
          Associated imaging-accession recording context, not the historical event accession or
          date
        status: verified
        caveats:
          - >-
            Candidate accession sentinel behavior and cross-table match coverage remain
            unresolved.
        cites:
          - internal-v2.patient-history-context#patient-and-accession-context
  comment:
    type: string
    nullable: true
    maps:
      - {id: internal-v2.hormone_history.comment, mapping: direct}
