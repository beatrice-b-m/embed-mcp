      "1":
        representation: "1"
        meaning: Feature or state is represented
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#legend-continuity
  changed:
    type: string
    nullable: true
    maps:
      - {id: imaging.change, mapping: direct, vocabulary: internal-v2.codes.imaging-change}
  USFinding:
    type: string
    nullable: true
    maps:
      - id: ultrasound.finding
        mapping: direct
        vocabulary: internal-v2.codes.ultrasound-finding
  shape:
    type: string
    nullable: true
    maps:
      - {id: ultrasound.shape, mapping: direct, vocabulary: internal-v2.codes.ultrasound-shape}
  orientation:
    type: string
    nullable: true
    maps:
      - id: ultrasound.orientation
        mapping: direct
        vocabulary: internal-v2.codes.ultrasound-orientation
  margins:
    type: string
    nullable: true
    maps:
      - id: ultrasound.margins
        mapping: direct
        vocabulary: internal-v2.codes.ultrasound-margins
  modifers:
    type: string
    nullable: true
    maps:
      - id: ultrasound.modifiers
        mapping: direct
