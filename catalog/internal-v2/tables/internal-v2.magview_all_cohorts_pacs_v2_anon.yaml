kind: table
label: magview_all_cohorts_PACS_v2_anon
grain: >-
  one finding-oriented denormalized MagView clinical association row with repeated patient and
  exam attributes and optional finding, procedure, pathology, and specimen representations
caveats:
  - No complete durable physical-row key is established.
  - >-
    Repeated patient attributes may vary over time and require an explicit as-of-time choice;
    repeated exam attributes should agree and conflicts are data-quality errors without a
    supplied repair policy.
  - >-
    The modality_desc occurrence is preferred; modality remains unmapped because its
    relationship to modality_desc is unknown.
  - >-
    Unmapped columns remain physically inventoried because their clinical meaning is unresolved
    or outside supported evidence.
keys:
  patient-locator:
    key_type: natural
    uniqueness: not_unique
    completeness: complete
    evidence: [release_schema, observed_source_values]
    caveats:
      - The anonymized identifier is release scoped and repeats across wide rows.
    columns: [empi_anon]
  exam-locator:
    key_type: natural
    uniqueness: not_unique
    completeness: complete
    evidence: [release_schema, observed_source_values]
    caveats:
      - The accession is source scoped and repeats for findings and downstream attachments.
    columns: [acc_anon]
  finding-locator:
    key_type: natural
    uniqueness: not_unique
    completeness: incomplete
    evidence: [release_schema, observed_source_values]
    caveats:
      - >-
        The clinical identity can occupy repeated rows while procedure, pathology, or descriptor
        fields differ.
      - >-
        A reserved negative finding number and data-quality conflicts prevent unconditional
        physical-row uniqueness.
    columns: [acc_anon, numfind]
  procedure-locator:
    key_type: natural
    uniqueness: unique
    completeness: incomplete
    evidence: [release_schema, maintainer_confirmed, observed_source_values]
    caveats:
      - >-
        Within one patient, each complete procedure-date, procedure-type, and biopsy-side tuple
        identifies one unique procedure.
      - >-
        Incomplete procedure fields prevent unconditional use of this locator, and the identity
        is not durable across releases.
    columns: [empi_anon, procdate_anon, type, bside]
  procedure-specimen-row-locator:
    key_type: natural
    uniqueness: unique
    completeness: incomplete
    evidence: [release_schema, observed_source_values]
    caveats:
      - >-
        Uniqueness applies only when every component is represented and does not establish
        durable clinical procedure or specimen identity.
      - >-
        This specimen-associated physical row locator must not be mistaken for the supported
        procedure locator.
      - Most procedure-associated rows cannot use this complete locator.
    columns:
      - acc_anon
      - side
      - numfind
      - procdate_anon
      - pdate_anon
      - type
      - technique
      - biopsite
      - surgery
      - lymphsurg
      - bside
      - specnum
objects:
  patient:
    completeness: complete
    authority: preferred
    derivation: projected
    identity_scope: >-
      Release-scoped anonymized patient identity within the internal MagView table.
    rows_per_instance: one_or_more
    longitudinal_identity: true
    caveats:
      - >-
        Patient-level attributes repeat across wide rows and may change or disagree; any
        latest-value use requires an explicit as-of time.
    object: patient
    cites:
      - internal-v2.magview-representation-context#wide-association-grain
      - internal-v2.magview-representation-context#patient-attribute-variation
    columns: [empi_anon]
    identity_columns: [empi_anon]
  breast_imaging_episode:
    completeness: partial
    authority: reference
    derivation: projected
    caveats:
      - The optional linked accession is not a complete episode identity or construction rule.
      - >-
        The reference can dangle; conflicting values across repeated rows are data-quality
        errors.
    object: breast_imaging_episode
    cites:
      - internal-v2.magview-representation-context#linked-accession-surface
    columns: [acc_anon, linkedaccession_anon]
  imaging_exam:
    completeness: complete
    authority: preferred
    derivation: projected
    identity_scope: Release-scoped imaging accession within the internal MagView source.
    rows_per_instance: one_or_more
    longitudinal_identity: false
    caveats:
      - >-
        Exam attributes should agree across repeated rows; conflicts are data-quality errors
        without a supplied repair rule.
    object: imaging_exam
    cites:
      - internal-v2.magview-representation-context#wide-association-grain
      - internal-v2.magview-representation-context#exam-attribute-inconsistency
    columns: [acc_anon]
    identity_columns: [acc_anon]
  breast_side:
    completeness: partial
    authority: preferred
    derivation: projected
    identity_scope: >-
      Unilateral left or right breast-side identity within one imaging accession; bilateral B
      and null occurrences project to both unilateral identities.
    rows_per_instance: one_or_more
    longitudinal_identity: false
    caveats:
      - >-
        Finding-side B and null are bilateral projections to both unilateral breast-side
        identities; neither creates a third bilateral identity.
    object: breast_side
    cites:
      - internal-v2.magview-coded-values-context#laterality-roles
    columns: [acc_anon, side]
    identity_columns: [acc_anon, side]
    reserved_exceptions:
      side=B:
        representation: B
        meaning: >-
          Bilateral finding-side occurrence that maps to both left and right breast-side
          identities.
        caveats:
          - Do not create a third bilateral breast-side identity.
        column: side
        cites:
          - internal-v2.magview-coded-values-context#laterality-roles
  imaging_finding:
    completeness: partial
    authority: preferred
    derivation: projected
    identity_scope: >-
      Ordinary clinical finding identity within one imaging accession; side is an attribute
      rather than an identity component.
    rows_per_instance: one_or_more
    longitudinal_identity: false
    caveats:
      - >-
        The locator can repeat across procedure, pathology, specimen, or differing descriptor
        rows.
      - Finding identity is accession scoped and does not persist longitudinally.
    object: imaging_finding
    cites:
      - internal-v2.magview-representation-context#finding-identity-scope
      - internal-v2.magview-representation-context#finding-procedure-repetition
    columns: [acc_anon, side, numfind]
    identity_columns: [acc_anon, numfind]
    reserved_exceptions:
      numfind=-9:
        representation: "-9"
        meaning: >-
          Synthetic contralateral BI-RADS 1 negative finding added by the EMBED extraction.
        caveats:
          - It is not an originally documented source finding.
        column: numfind
        cites:
          - internal-v2.magview-representation-context#synthetic-contralateral-negative-finding
  imaging_interpretation:
    completeness: partial
    authority: preferred
    derivation: projected
    caveats:
      - >-
        Assessment and recommendation are co-located but no independent interpretation identity
        or timestamp is supplied.
    object: imaging_interpretation
    cites:
      - internal-v2.magview-coded-values-context#legend-continuity
    columns: [asses, recc]
  procedure:
    completeness: partial
    authority: preferred
    derivation: projected
    identity_scope: >-
      Release-scoped procedure identity; within one patient the identifying tuple is procedure
      date, procedure type, and biopsy side.
    rows_per_instance: one_or_more
    longitudinal_identity: false
    caveats:
      - >-
        Within a patient, procedure date, procedure type, and biopsy side identify one unique
        procedure.
      - >-
        The identity is incomplete when any component is absent and is not durable across
        releases; one finding with multiple procedures occupies repeated rows.
    object: procedure
    cites:
      - internal-v2.magview-pathology-context#procedure-pathology-attachment
    columns:
      - empi_anon
      - acc_anon
      - numfind
      - procdate_anon
      - type
      - technique
      - biopsite
      - surgery
      - lymphsurg
      - bside
    identity_columns: [empi_anon, procdate_anon, type, bside]
  pathology_specimen:
    completeness: unknown
    authority: unspecified
    derivation: projected
    caveats:
      - >-
        Specimen-level presence, completeness, reliability, identity, and cardinality are
        unresolved; current internal operations should not rely on this binding.
      - >-
        Specimen number is source scoped, not globally unique, and can repeat across physical
        rows.
      - No durable specimen identity or specimen-collection timestamp is established.
    object: pathology_specimen
    cites:
      - internal-v2.magview-pathology-context#specimen-surface
    columns:
      - acc_anon
      - side
      - numfind
      - procdate_anon
      - pdate_anon
      - type
      - technique
      - biopsite
      - surgery
      - lymphsurg
      - bside
      - specnum
  pathology_observation:
    completeness: partial
    authority: preferred
    derivation: projected
    caveats:
      - >-
        Descriptor slots share one dictionary; slot position and duplicate occurrences do not
        imply weight or chronology.
      - Some represented descriptor code meanings remain unresolved.
    object: pathology_observation
    cites:
      - internal-v2.magview-pathology-context#procedure-pathology-attachment
      - internal-v2.magview-pathology-context#path-severity-derived-occurrence
    columns: [path1, path2, path3, path4, path5, path6, path7, path8, path9, path10]
  pathology_diagnosis:
    completeness: partial
    authority: preferred
    derivation: projected
    caveats:
      - >-
        The row-level severity is descriptor derived and not a supplied reduction across every
        row linked to one finding.
      - >-
        Severity code 6 is invalid and has no expected meaning, while regional-node TNM code
        meanings remain unresolved.
    object: pathology_diagnosis
    cites:
      - internal-v2.magview-pathology-context#path-severity-derived-occurrence
    columns: [path_severity, hgrade, tnmpt, tnmpn, tnmm, tnmdesc, tnmr, stage]
columns:
  empi_anon:
    type: int64
    nullable: true
    maps:
      - {id: identity.patient_identifier, mapping: direct}
  studydate_anon:
    type: timestamp[ns]
    nullable: true
    maps:
      - id: exam.study_date
        mapping: direct
        notes:
          - >-
            Profile-specific maintainer confirmation establishes exam occurrence time and a
            consistent patient-specific anonymization shift.
  acc_anon:
    type: int64
    nullable: true
    maps:
      - {id: exam.accession_identifier, mapping: direct}
  linkedaccession_anon:
    type: int64
    nullable: true
    maps:
      - {id: imaging.linked_accession_identifier, mapping: direct}
  desc:
    type: string
    nullable: true
    maps:
      - {id: exam.procedure_description, mapping: direct}
  modality_desc:
    type: string
    nullable: true
    maps:
      - id: exam.modality
        mapping: direct
        vocabulary: internal-v2.codes.exam-modality
        notes:
          - >-
            This is the preferred internal V2 modality occurrence; the separate modality column
            remains unmapped.
  loc_num_anon:
    type: string
    nullable: true
    maps:
      - {id: exam.location, mapping: direct, vocabulary: internal-v2.codes.exam-location}
  accession_type:
    type: string
    nullable: true
    maps:
      - id: internal-v2.exam.accession_source_type
        mapping: direct
        vocabulary: internal-v2.codes.exam-accession-source-type
        accession_role: current
  linkedaccession_type:
    type: string
    nullable: true
    maps:
      - id: internal-v2.exam.accession_source_type
        mapping: conditional
        vocabulary: internal-v2.codes.exam-accession-source-type
        accession_role: linked
    interpretations:
      "null":
        representation: "null"
        meaning: >-
          No linked-accession source type is represented; absence of a linked exam is not proved
          by this field alone
        status: reconciled
        cites:
          - internal-v2.magview-representation-context#linked-accession-surface
  mg_exam_type:
    type: string
    nullable: true
    maps:
      - id: exam.mammography_type
        mapping: direct
        vocabulary: internal-v2.codes.exam-mammography-type
  vtype:
    type: string
    nullable: true
    maps:
      - {id: exam.visit_type, mapping: direct, vocabulary: internal-v2.codes.exam-visit-type}
  recc:
    type: string
    nullable: true
    maps:
      - id: imaging.recommendation
        mapping: direct
        vocabulary: internal-v2.codes.imaging-recommendation
  tissueden:
    type: int8
    nullable: true
    maps:
      - id: exam.tissue_density
        mapping: direct
        vocabulary: internal-v2.codes.exam-tissue-density
  side:
    type: string
    nullable: true
    maps:
      - id: breast.side
        mapping: direct
        vocabulary: internal-v2.codes.breast-side
        role: finding
    interpretations:
      B:
        representation: B
        meaning: >-
          Bilateral finding side, projecting semantically to both the left and right breast-side
          identities for the exam
        status: verified
        caveats:
          - B does not create a third bilateral breast-side identity.
        cites:
          - internal-v2.magview-coded-values-context#laterality-roles
      "null":
        representation: "null"
        meaning: >-
          Bilateral finding side, equivalent to source code B and projecting semantically to
          both the left and right breast-side identities for the exam
        status: verified
        caveats:
          - Null in this finding-side occurrence is not unknown laterality.
        cites:
          - internal-v2.magview-coded-values-context#laterality-roles
  numfind:
    type: int8
    nullable: true
    maps:
      - {id: imaging.finding_number, mapping: direct}
    interpretations:
      "-9":
        representation: "-9"
        meaning: >-
          Synthetic contralateral BI-RADS 1 negative finding implied by a bilateral exam with a
          unilateral non-negative finding
        status: verified
        caveats:
          - >-
            This is an extraction-added finding rather than an originally documented source
            finding.
        cites:
          - internal-v2.magview-representation-context#synthetic-contralateral-negative-finding
  asses:
    type: string
    nullable: true
    maps:
      - id: imaging.assessment
        mapping: direct
        vocabulary: internal-v2.codes.imaging-assessment
    interpretations:
      s:
        representation: s
        meaning: Suspicious after supported uppercase and surrounding-whitespace normalization
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#code-normalization
  total_L_find:
    type: int8
    nullable: true
    maps:
      - {id: exam.left_finding_total, mapping: derived}
  total_R_find:
    type: int8
    nullable: true
    maps:
      - {id: exam.right_finding_total, mapping: derived}
  path_severity:
    type: int8
    nullable: true
    maps:
      - id: pathology.severity
        mapping: derived
        vocabulary: internal-v2.codes.pathology-severity
    interpretations:
      "6":
        representation: "6"
        meaning: >-
          Invalid source value with no expected meaning outside the governed clinical severity
          scale
        status: verified
        caveats:
          - >-
            Exclude or explicitly flag this value rather than assigning or ordering it as a
            diagnosis group.
        cites:
          - internal-v2.magview-pathology-context#path-severity-six
      "null":
        representation: "null"
        meaning: >-
          No pathology severity or path1 through path10 descriptor is attached to this row
          occurrence
        status: reconciled
        caveats:
          - >-
            Null is not a benign, negative, or code-6 category; any populated descriptor
            alongside null severity is a data-quality error.
        cites:
          - internal-v2.magview-pathology-context#path-severity-derived-occurrence
  cancer_outcome_registry_id:
    type: int8
    nullable: true
    maps:
      - id: internal-v2.technical.cancer_registry_record_identifier
        mapping: conditional
        notes:
          - >-
            This technical reference is meaningful only as the tuple (empi_anon,
            cancer_outcome_registry_id) against the separate registry-derived table; it is not
            itself an outcome.
        composite_with: empi_anon
  mass:
    type: int8
    nullable: true
    maps:
      - {id: mammography.mass_present, mapping: direct}
    interpretations:
      "0":
        representation: "0"
        meaning: Feature or state is not represented
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#legend-continuity
      "1":
        representation: "1"
        meaning: Feature or state is represented
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#legend-continuity
  asymmetry:
    type: int8
    nullable: true
    maps:
      - {id: mammography.asymmetry_present, mapping: direct}
    interpretations:
      "0":
        representation: "0"
        meaning: Feature or state is not represented
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#legend-continuity
      "1":
        representation: "1"
        meaning: Feature or state is represented
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#legend-continuity
  arch_distortion:
    type: int8
    nullable: true
    maps:
      - {id: mammography.architectural_distortion_present, mapping: direct}
    interpretations:
      "0":
        representation: "0"
        meaning: Feature or state is not represented
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#legend-continuity
      "1":
        representation: "1"
        meaning: Feature or state is represented
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#legend-continuity
  calc:
    type: int8
    nullable: true
    maps:
      - {id: mammography.calcification_present, mapping: direct}
    interpretations:
      "0":
        representation: "0"
        meaning: Feature or state is not represented
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#legend-continuity
      "1":
        representation: "1"
        meaning: Feature or state is represented
        status: reconciled
        cites:
          - internal-v2.magview-coded-values-context#legend-continuity
  massshape:
    type: string
    nullable: true
    maps:
      - id: mammography.mass_shape
        mapping: direct
        vocabulary: internal-v2.codes.mammography-mass-shape
  massmargin:
    type: string
    nullable: true
    maps:
      - id: mammography.mass_margin
        mapping: direct
        vocabulary: internal-v2.codes.mammography-mass-margin
  massdens:
    type: string
    nullable: true
    maps:
      - id: mammography.mass_density
        mapping: direct
        vocabulary: internal-v2.codes.mammography-mass-density
  calcfind:
    type: string
    nullable: true
    maps:
      - id: mammography.calcification_morphology
        mapping: direct
        vocabulary: internal-v2.codes.mammography-calcification-morphology
  calcdistri:
    type: string
    nullable: true
    maps:
      - id: mammography.calcification_distribution
        mapping: direct
        vocabulary: internal-v2.codes.mammography-calcification-distribution
  calcnumber:
    type: string
    nullable: true
    maps:
      - {id: mammography.calcification_number, mapping: direct}
    interpretations:
      "-2.0":
        representation: "-2.0"
        meaning: Unresolved exceptional calcification-number representation
        status: unresolved
        caveats:
          - Do not treat this source string as a validated count.
        cites:
          - internal-v2.magview-coded-values-context#numeric-exceptions
      "-3.0":
        representation: "-3.0"
        meaning: Unresolved exceptional calcification-number representation
        status: unresolved
        caveats:
          - Do not treat this source string as a validated count.
        cites:
          - internal-v2.magview-coded-values-context#numeric-exceptions
      "-5.0":
        representation: "-5.0"
        meaning: Unresolved exceptional calcification-number representation
        status: unresolved
        caveats:
          - Do not treat this source string as a validated count.
        cites:
          - internal-v2.magview-coded-values-context#numeric-exceptions
      "-6.0":
        representation: "-6.0"
        meaning: Unresolved exceptional calcification-number representation
        status: unresolved
        caveats:
          - Do not treat this source string as a validated count.
        cites:
          - internal-v2.magview-coded-values-context#numeric-exceptions
  otherfind:
    type: string
    nullable: true
    maps:
      - id: mammography.other_finding
        mapping: direct
        vocabulary: internal-v2.codes.mammography-other-finding
  implanfind:
    type: string
    nullable: true
    maps:
      - id: mammography.implant_finding
        mapping: direct
        vocabulary: internal-v2.codes.mammography-implant-finding
  consistent:
    type: string
    nullable: true
    maps:
      - id: mammography.consistent_with
        mapping: direct
        vocabulary: internal-v2.codes.mammography-consistent-with
  procdate_anon:
    type: timestamp[ns]
    nullable: true
    maps:
      - id: pathology.procedure_date
        mapping: direct
        notes:
          - >-
            Profile-specific maintainer confirmation establishes procedure occurrence time and a
            consistent patient-specific anonymization shift.
  pdate_anon:
    type: timestamp[ns]
    nullable: true
    maps:
      - id: pathology.report_date
        mapping: ambiguous
        notes:
          - >-
            Believed to represent pathology-report documentation time, but the interpretation
            remains provisional and the field is rarely used in current internal workflows.
  mdelayed.1:
    type: string
    nullable: true
    maps:
      - id: mri.delayed_kinetics_secondary
        mapping: unresolved
        notes:
          - >-
            The comparison dictionaries do not establish the role of this secondary
            delayed-kinetics occurrence.
  secondaryfindings:
    type: string
    nullable: true
    maps:
      - id: ultrasound.secondary_findings
        mapping: direct
        vocabulary: internal-v2.codes.ultrasound-secondary-findings
  ethnic:
    type: int16
    nullable: true
  livebirths:
    type: int8
    nullable: true
  modality:
    type: string
    nullable: true
  dt_final_anon:
    type: timestamp[ns]
    nullable: true
  dt_rel_anon:
    type: timestamp[ns]
    nullable: true
  size:
    type: int16
    nullable: true
    maps:
      - {id: imaging.finding_size, mapping: direct}
    interpretations:
      "-99":
        representation: "-99"
        meaning: >-
          Unresolved exceptional source representation; not a validated physical measurement
        status: unresolved
        cites:
          - internal-v2.magview-coded-values-context#numeric-exceptions
  location:
    type: string
    nullable: true
    maps:
      - {id: imaging.location, mapping: direct, vocabulary: internal-v2.codes.breast-location}
  depth:
    type: string
    nullable: true
    maps:
