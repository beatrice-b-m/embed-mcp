    interpretations:
      affirmative state only:
        representation: affirmative state only
        meaning: >-
          The extraction marked the image row as a spot-compression or magnification acquisition
        status: unverified
        caveats:
          - The flag does not distinguish spot compression from magnification.
      "null":
        representation: "null"
        meaning: No spot or magnification indication is represented
        status: unresolved
        caveats:
          - >-
            Absence is not a negative determination, and the affirmative state does not occur on
            tomosynthesis-classified rows.
