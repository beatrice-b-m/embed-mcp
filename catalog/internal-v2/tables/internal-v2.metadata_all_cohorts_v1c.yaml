  acc_anon:
    type: int64
    nullable: true
    maps:
      - id: exam.accession_identifier
        mapping: direct
        notes:
          - >-
            The accession repeats across the exam's image rows and identifies one distinct exam
            in the shared cross-table namespace; each accession belongs to exactly one patient
            and a cross-patient association is an invalid data-quality error.
  study_date_anon:
    type: string
    nullable: true
    maps:
      - {id: exam.study_date, mapping: direct}
    interpretations:
      text-serialized date value:
        representation: text-serialized date value
        meaning: >-
          The same anonymized exam event date represented by clinical studydate_anon, exported
          as text in internal V1c image metadata
        status: verified
        caveats:
          - >-
            The value is text rather than a parsed timestamp, unlike the clinical table's
            exam-date projection.
        cites:
          - internal-v2.v1c-metadata-context#cross-table-date-alignment
