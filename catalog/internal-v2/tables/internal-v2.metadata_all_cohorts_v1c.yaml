kind: table
label: metadata_all_cohorts_v1c
grain: >-
  one internal V1c image-metadata row describing the attributes of one extracted breast-imaging
  DICOM image instance, carrying repeated patient and exam projections and serialized per-image
  region-of-interest collections
caveats:
  - >-
    The artifact is delimited text with no embedded column schema: recorded physical types are
    assessed parse types from a deterministic full-file text scan, not a source-declared schema.
  - >-
    Because the artifact declares no nullability, every column is conservatively recorded as
    nullable; this is not a statement about observed missingness.
  - >-
    The artifact declares no numeric width, so every integer-parsable column is recorded at the
    widest deterministic integer type rather than a narrower assessed magnitude.
  - >-
    A few inventoried columns yield no parsable value in this extraction, so their parse type
    defaults to text and their meaning is unresolved.
  - >-
    Region-of-interest information is serialized in per-row collections; this table is not one
    row per region of interest.
  - >-
    This extraction is internal V1c and covers every EMBEDv1 exam and patient; it remains
    narrower than internal clinical V2, so absence of a later clinical V2 exam here is not
    absence of images.
  - >-
    DICOM objects associated with EMBEDv1 accessions were extracted, then secondary captures and
    screen saves were excluded except ROI_SS and ROI_SSC images retained solely for ROI
    extraction.
  - >-
    ROI_SS and ROI_SSC rows contain burned-in radiologist annotations used to extract
    coordinates and transfer them to the original images; they are one annotation source and are
    not intended for other use.
  - >-
    Other ROI workflows include annotation DICOM objects without pixel arrays, from which
    coordinates were extracted directly before attachment to the corresponding target images.
  - >-
    DICOM time-of-day attributes are numerically parsable, so a numeric parse discards zero
    padding and any fractional-second form; they remain inventoried and unmapped.
  - >-
    DICOM PatientAge is top-coded to 89, PatientSex is unchanged, and sensitive
    non-identifier/non-date attributes were dropped during anonymization.
  - >-
    Detailed DICOM acquisition, dose, detector, collimator, geometry, windowing, and icon-image
    columns carry standard DICOM element semantics but are not mapped to features.
keys:
  patient-locator:
    key_type: natural
    uniqueness: not_unique
    completeness: complete
    evidence: [observed_source_values]
    caveats:
      - >-
        The anonymized identifier repeats across the patient's image rows and remains
        patient-level.
      - >-
        The identifier uses the same anonymization namespace as the clinical table and supports
        cross-table patient identity.
    columns: [empi_anon]
  exam-locator:
    key_type: natural
    uniqueness: not_unique
    completeness: complete
    evidence: [observed_source_values]
    caveats:
      - The accession repeats across the exam's image rows and remains exam-level.
      - >-
        acc_anon remains the identifier of one distinct exam across EMBED and belongs to exactly
        one patient; an association with more than one patient identifier is an invalid
        data-quality error.
    columns: [acc_anon]
  image-file-locator:
    key_type: technical
    uniqueness: unique
    completeness: incomplete
    evidence: [observed_source_values]
    caveats:
      - >-
        The path is a technical file reference whose filename without .dcm is the anonymized SOP
        Instance UID and supplies identity within one dataset version.
      - >-
        It is intended to be defined for every extracted image row; a missing value likely means
        anonymization failed before the de-identified file could be saved.
      - >-
        Because missing values occur, it cannot serve as a complete physical row key in this
        extraction.
    columns: [anon_dicom_path]
  dicom-position-locator:
    key_type: technical
    uniqueness: not_unique
    completeness: complete
    evidence: [observed_source_values]
    caveats:
      - >-
        DICOM series and instance numbers do not distinguish one image row within an accession,
        including among rows that carry a file locator.
    columns: [acc_anon, SeriesNumber, InstanceNumber]
  acquisition-group-locator:
    key_type: technical
    uniqueness: not_unique
    completeness: complete
    evidence: [observed_source_values]
    caveats:
      - >-
        The value is globally unique for one simultaneous acquisition group and is stable across
        reruns.
      - >-
        It is constructed from acc_anon, ProtocolName with spaces replaced by hyphens, and
        integer-cast ContentTime.
      - It is not a region-of-interest identity or correspondence grouping.
    columns: [acquisition_group_id]
objects:
  image:
    completeness: partial
    authority: preferred
    derivation: source
    identity_scope: >-
      Dataset-version-scoped anonymized SOP Instance UID encoded in the anon_dicom_path filename
      without the .dcm suffix.
    rows_per_instance: exactly_one
    longitudinal_identity: false
    caveats:
      - >-
        Coverage is internal V1c: it covers the complete EMBEDv1 exam and patient set and is
        narrower than the internal clinical V2 table.
      - >-
        The anon_dicom_path basename is the anonymized SOP Instance UID and supplies
        dataset-version-scoped image identity; a missing path makes that identity unavailable
        for the affected row.
      - >-
        DICOM-derived attributes, pipeline-derived classifications, and enrichment flags are
        separate mappings and must not be conflated.
      - >-
        Legacy PNG locators and has_pix_array must not be used as current image-availability
        evidence.
      - >-
        The anonymized DICOM locator is intended to be present; a missing value likely means
        anonymization failed before the de-identified file was saved and is a data-quality
        defect.
    object: image
    cites:
      - internal-v2.v1c-metadata-context#image-row-grain
      - internal-v2.v1c-metadata-context#image-instance-identity
      - internal-v2.v1c-metadata-context#version-boundary
      - internal-v2.v1c-metadata-context#modality-surface
      - internal-v2.v1c-metadata-context#locator-and-enrichment-population
      - internal-v2.v1c-metadata-context#burned-in-annotation-semantics
    columns:
      - empi_anon
      - acc_anon
      - study_date_anon
      - anon_dicom_path
      - png_path
      - png_folder_path
      - png_filename
      - StudyID
      - SeriesNumber
      - InstanceNumber
      - acquisition_group_id
      - Modality
      - ImageType
      - FinalImageType
      - ViewPosition
      - 0_ViewCodeSequence_CodeMeaning
      - 0_ViewCodeSequence_0_ViewModifierCodeSequence_CodeMeaning
      - spot_mag
      - ImageLaterality
      - Laterality
      - ImageLateralityFinal
      - LateralityDeriveFlag
      - BodyPartExamined
      - PresentationIntentType
      - PhotometricInterpretation
      - PixelRepresentation
      - Rows
      - Columns
      - BitsAllocated
      - BitsStored
      - HighBit
      - SamplesPerPixel
      - ImagesInAcquisition
      - ImagerPixelSpacing
      - PixelSpacing
      - CompressionForce
      - BodyPartThickness
      - KVP
      - EntranceDoseInmGy
      - Manufacturer
      - ManufacturerModelName
      - SoftwareVersions
      - DetectorType
      - BreastImplantPresent
      - BurnedInAnnotation
      - ConversionType
      - category
      - has_pix_array
      - num_ROI
    identity_columns: [anon_dicom_path]
    reserved_exceptions:
      anon_dicom_path=null or blank:
        representation: null or blank
        meaning: >-
          Invalid row-level exception in which anonymization likely failed before the
          de-identified DICOM file and its exported SOP Instance UID representation could be
          saved.
        caveats:
          - This is a data-quality defect and does not define a second image-identity scheme.
        column: anon_dicom_path
        cites:
          - internal-v2.v1c-metadata-context#image-instance-identity
  region_of_interest:
    completeness: partial
    authority: preferred
    derivation: derived
    caveats:
      - >-
        One image row carries a collection of zero or more regions, so this binding is a
        collection-valued occurrence and not a row-per-region representation.
      - >-
        No region identifier is declared: within a row a region is addressable only by its
        position in the aligned collections, and position is not durable identity.
      - >-
        Coordinates use inclusive [y_min, x_min, y_max, x_max] bounds directly in the attached
        DICOM pixel-array coordinate space; curated coordinates are expected in bounds, and
        residual out-of-bounds values may be safely clipped.
      - >-
        ROIs originate from radiologist annotations created during routine clinical operations
        through multiple source workflows, including direct coordinate extraction from
        annotation DICOM objects without pixel arrays and annotation extraction from
        ROI_SS/ROI_SSC screen captures; model-inferred DBT depth is marked by ROI_depth_derived.
      - >-
        Correspondence among regions on separate images of one acquisition group is not
        represented.
      - >-
        ROI-to-finding attribution is reliable only when exactly one finding is represented on
        the same accession side; multiple findings on one side cannot be individually linked.
    object: region_of_interest
    cites:
      - internal-v2.roi-context#roi-attached-to-image
      - internal-v2.roi-context#roi-serialized-collections
      - internal-v2.roi-context#roi-coordinate-geometry
      - internal-v2.roi-context#roi-identity-and-provenance
      - internal-v2.roi-context#roi-cross-image-correspondence-absent
      - internal-v2.roi-context#roi-finding-attribution
    columns: [num_ROI, ROI_coords, ROI_frames, ROI_depth_derived]
  patient:
    completeness: partial
    authority: reference
    derivation: projected
    identity_scope: >-
      Release-scoped anonymized patient identity within the internal V1c image-metadata
      extraction.
    rows_per_instance: one_or_more
    longitudinal_identity: true
    caveats:
      - >-
        The patient identifier repeats across the patient's image rows and remains
        patient-level; row multiplicity is not clinical multiplicity.
      - >-
        The clinical table remains the preferred patient representation; this projection carries
        only top-coded age-at-imaging and unchanged DICOM patient sex.
      - >-
        The identifier uses the same anonymization namespace as the clinical table and supports
        cross-table patient identity.
    object: patient
    cites:
      - internal-v2.v1c-metadata-context#patient-and-exam-projection
      - internal-v2.v1c-metadata-context#version-boundary
    columns: [empi_anon, PatientAge, PatientSex]
    identity_columns: [empi_anon]
  imaging_exam:
    completeness: partial
    authority: reference
    derivation: projected
    identity_scope: >-
      Cross-table accession-scoped exam identity shared by the internal V1c image metadata and
      clinical table; not longitudinal.
    rows_per_instance: one_or_more
    longitudinal_identity: false
    caveats:
      - The accession repeats across the exam's image rows and remains exam-level.
      - >-
        acc_anon uses the same anonymization namespace as the clinical table and identifies one
        distinct exam across EMBED.
      - >-
        Association with more than one patient identifier is an invalid data-quality error and
        must not be retained as a valid identity or linkage association.
      - >-
        The patient identifier supports cross-table patient identity and consistency checking
        but is not an exam-identity component.
      - >-
        Only an accession, an exam date, a cohort number, and top-coded DICOM patient age
        project here; the clinical table remains the preferred exam representation.
      - Exam coverage is internal V1c and narrower than internal clinical V2.
    object: imaging_exam
    cites:
      - internal-v2.v1c-metadata-context#patient-and-exam-projection
      - internal-v2.v1c-metadata-context#version-boundary
      - internal-v2.v1c-metadata-context#coverage-is-not-image-absence
    columns: [acc_anon, study_date_anon, cohort_num, PatientAge]
    identity_columns: [acc_anon]
  breast_side:
    completeness: partial
    authority: alternative
    derivation: derived
    caveats:
      - >-
        ImageLateralityFinal is the reliable attribute for the breast represented by the image;
        it is not automatically the imaging-finding or procedure side.
      - >-
        Only left and right are represented; a missing derived laterality is not bilateral and
        prevents a side projection for that row.
      - No side identity is declared because the derived laterality is not always resolved.
    object: breast_side
    cites:
      - internal-v2.v1c-metadata-context#laterality-roles
    columns: [acc_anon, ImageLateralityFinal]
