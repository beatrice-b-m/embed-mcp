  anon_dicom_path:
    type: string
    nullable: true
    maps:
      - {id: internal-v2.image.dicom_file_locator, mapping: direct}
      - id: internal-v2.image.sop_instance_identifier
        mapping: derived
        notes:
          - >-
            Take the filename without the .dcm suffix; the anonymized SOP Instance UID is
            durable within one dataset version.
  acquisition_group_id:
    type: string
    nullable: true
    maps:
      - {id: internal-v2.image.acquisition_group_identifier, mapping: derived}
  ROI_coords:
    type: string
    nullable: true
    maps:
      - {id: internal-v2.roi.coordinate_collection, mapping: derived}
    interpretations:
      serialized collection of four-element integer rectangles:
        representation: serialized collection of four-element integer rectangles
        meaning: >-
          One [y_min, x_min, y_max, x_max] rectangle with inclusive minimum and maximum bounds
          in the attached DICOM pixel-array coordinate space for each region of interest
        status: verified
        caveats:
          - No spacing or orientation transformation is required.
          - >-
            For NumPy slicing, add one to each inclusive maximum: [100, 200, 150, 250] maps to
            image[100:151, 200:251] and yields 51 by 51 pixels.
          - >-
            Curated coordinates are expected to lie within the attached pixel array; residual
            out-of-bounds components may be safely clipped to the valid bounds.
        cites:
          - internal-v2.roi-context#roi-coordinate-geometry
      empty serialized collection:
        representation: empty serialized collection
        meaning: No region of interest is represented for the image row
        status: reconciled
        cites:
          - internal-v2.roi-context#roi-serialized-collections
  ROI_frames:
    type: string
    nullable: true
    maps:
      - {id: internal-v2.roi.frame_index_collection, mapping: derived}
    interpretations:
      serialized collection of zero-based frame-index lists:
        representation: serialized collection of zero-based frame-index lists
        meaning: >-
          For DBT images, one nested list of one or more matched frame indices for each
          positionally corresponding region of interest
        status: verified
        caveats:
          - Values represented for 2D and synthetic 2D images are not informative.
          - >-
            When ImagesInAcquisition is represented for the DBT row, each zero-based frame index
            should be less than that frame count.
        cites:
          - internal-v2.roi-context#roi-frame-depth-semantics
      empty serialized collection alongside represented regions of interest:
        representation: empty serialized collection alongside represented regions of interest
        meaning: No frame indices are represented for the row's regions
        status: verified
        caveats: [An empty collection is not frame zero.]
        cites:
          - internal-v2.roi-context#roi-frame-depth-semantics
  ROI_depth_derived:
    type: string
    nullable: true
    maps:
      - {id: internal-v2.roi.depth_derivation_flag_collection, mapping: derived}
    interpretations:
      true at one ROI-list position:
        representation: true at one ROI-list position
        meaning: >-
          An in-house model inferred the corresponding DBT ROI frame-depth coordinates after
          radiologist x/y coordinates were transferred from a grouped 2D image
        status: verified
        caveats:
          - >-
            The boolean refers to inferred z/depth information, not to retrospective creation of
            the underlying radiologist clinical annotation.
        cites:
          - internal-v2.roi-context#roi-frame-depth-semantics
  num_ROI:
    type: int64
    nullable: true
    maps:
      - {id: internal-v2.image.region_of_interest_count, mapping: derived}
