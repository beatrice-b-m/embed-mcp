kind: vocabulary
label: Provisional breast-history code meanings
completeness: unknown
parsing: atomic
evidence: [observed_source_values, inference]
caveats:
  - >-
    Candidate meanings from a work-in-progress internal-dictionary reconciliation; not final
    verified CancerHist code definitions.
  - >-
    Meaning is category-specific; no severity or malignancy rule follows from category
    membership.
  - >-
    Applies only under type B.
    B, blank, DCG, DCS, and XX have no assigned meaning; a broader pathology dictionary does not
    resolve their CancerHist occurrences.
