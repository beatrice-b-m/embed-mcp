kind: vocabulary
label: DICOM Burned In Annotation values
completeness: closed
parsing: atomic
evidence: [observed_source_values, inference]
caveats:
  - >-
    These values carry the standard DICOM meaning; they do not declare whether any
    non-identifying annotation is present.
  - The attribute is a source declaration and is not a verification of pixel data.
  - >-
    An absent value means the presence of sufficient identifying burned-in annotation is
    unknown.
codes:
  "YES": >-
    The source declares that the image contains sufficient burned-in annotation to identify the
    patient and the date the image was acquired
  "NO": >-
    The source declares that the image does not contain sufficient burned-in annotation to
    identify the patient and the date the image was acquired
