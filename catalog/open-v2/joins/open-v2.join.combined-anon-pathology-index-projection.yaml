kind: join
join_type: projection
source_completeness: required
cardinality:
  targets_per_source: zero_or_one
  sources_per_target: exactly_one
evidence: [cross_table_check]
hazards:
  - This release-local technical projection is not a clinical join key.
  - Do not infer pathology availability at imaging time from wide-row co-location.
caveats:
  - >-
    Every normalized pathology index is represented in the wide index surface, but some wide
    rows have no pathology counterpart.
cites:
  - open-v2.temporal-availability-context#wide-table-colocation
source_columns: [open-v2.combined_anon#__index_level_0__]
target_columns:
  - open-v2.pathology_findings_anon#__index_level_0__
