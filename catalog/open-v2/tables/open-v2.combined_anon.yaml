kind: table
label: combined_anon
grain: wide_row
caveats:
  - No tested standard natural-key join reproduces this table.
  - >-
    Its construction and authority when repeated values disagree with normalized tables remain
    unresolved.
  - >-
    Its column mappings transfer canonical feature context only; value equality, derivation,
    observed domain, and occurrence-specific missingness were not established.
keys:
  finding_tuple:
    key_type: natural
    uniqueness: unknown
    completeness: incomplete
    evidence: [release_schema, cross_table_check, unresolved]
    caveats:
      - >-
        The tuple resolves complete rows to finding surfaces but is not established as the
        wide-row key.
      - Null and sentinel-like side or finding states prevent an unconditional natural-key join.
    columns: [acc_anon, side, numfind]
  export_index:
    key_type: technical
    uniqueness: unique
    completeness: complete
    evidence: [release_schema, cross_table_check]
    caveats:
      - >-
        The retained index is release-local construction provenance, not a clinical key or
        current row position.
      - The wide index contains rows outside both normalized finding-table index surfaces.
    columns: [__index_level_0__]
objects:
  patient:
    derivation: projected
    caveats:
      - >-
        Wide-row co-location does not establish authority or equality for every repeated patient
        attribute.
    object: patient
    cites:
      - open-v2.temporal-availability-context#wide-object-projection
    columns: [empi_anon]
  breast_imaging_episode:
    derivation: projected
    caveats:
      - >-
        The projection carries an optional same-episode reference but no complete episode
        identity or construction rule.
    object: breast_imaging_episode
    cites:
      - open-v2.linked-exam-context#optional-reference
      - open-v2.linked-exam-context#link-meaning
      - open-v2.temporal-availability-context#wide-object-projection
    columns: [acc_anon, linkedaccession_anon]
  imaging_exam:
    derivation: projected
    caveats:
      - >-
        Exam attributes repeat at wide-row grain and do not become finding- or pathology-grain
        facts.
    object: imaging_exam
    cites:
      - open-v2.temporal-availability-context#wide-object-projection
    columns: [acc_anon]
  breast_side:
    derivation: projected
    caveats:
      - >-
        Incomplete tuples and context-dependent null laterality prevent an unconditional side
        identity.
    object: breast_side
    cites:
      - open-v2.multimodal-finding-context#finding-side-null
      - open-v2.temporal-availability-context#wide-object-projection
    columns: [acc_anon, side]
  imaging_finding:
    derivation: projected
    identity_scope: >-
      Distinct clinical finding within one accession after excluding reserved synthetic entries.
    rows_per_instance: one_or_more
    longitudinal_identity: false
    caveats:
      - >-
        The wide projection can contain rows without a resolving normalized imaging index and
        does not establish a cross-release finding key.
      - The clinical identity omits side and may occupy multiple physical rows.
    object: imaging_finding
    cites:
      - open-v2.multimodal-finding-context#descriptor-families
      - open-v2.multimodal-finding-context#synthetic-contralateral-finding
      - open-v2.temporal-availability-context#wide-object-projection
    columns: [acc_anon, side, numfind]
    identity_columns: [acc_anon, numfind]
    reserved_exceptions:
      numfind=-9:
        representation: "-9"
        meaning: >-
          Derived synthetic contralateral negative finding rather than an ordinary clinical
          finding identity.
        caveats:
          - Exclude this reserved value when identifying ordinary distinct clinical findings.
        column: numfind
        cites:
          - open-v2.multimodal-finding-context#synthetic-contralateral-finding
  imaging_interpretation:
    derivation: projected
    caveats:
      - >-
        Projected assessment and recommendation do not gain an independent interpretation
        identity, timestamp, or co-availability guarantee.
    object: imaging_interpretation
    cites:
      - open-v2.assessment-recommendation-context#separate-fields
      - open-v2.assessment-recommendation-context#wide-projection-boundary
      - open-v2.temporal-availability-context#wide-object-projection
    columns: [asses, recc]
  procedure:
    derivation: projected
    caveats:
      - >-
        Projected procedure fields do not establish a unique procedure identity or availability
        at imaging time.
    object: procedure
    cites:
      - open-v2.pathology-procedure-context#separate-pathology-surface
      - open-v2.temporal-availability-context#wide-table-colocation
      - open-v2.temporal-availability-context#wide-object-projection
    columns: [procdate_anon, type]
  pathology_observation:
    derivation: projected
    caveats:
      - >-
        Projected descriptor slots retain their procedure association and do not become
        contemporaneous imaging observations.
    object: pathology_observation
    cites:
      - open-v2.pathology-procedure-context#diagnosis-slot-order
      - open-v2.temporal-availability-context#wide-table-colocation
      - open-v2.temporal-availability-context#wide-object-projection
    columns: [path1, path2, path3, path4, path5, path6, path7, path8, path9, path10]
  pathology_diagnosis:
    derivation: projected
    caveats:
      - >-
        Projected severity retains unattached-pathology null semantics and does not establish
        availability at imaging time.
    object: pathology_diagnosis
    cites:
      - open-v2.pathology-procedure-context#severity-meaning
      - open-v2.temporal-availability-context#wide-table-colocation
      - open-v2.temporal-availability-context#wide-object-projection
    columns: [path_severity]
