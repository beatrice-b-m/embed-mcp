kind: table
label: exam_level_anon
grain: exam
caveats:
  - >-
    Anonymized study dates are not relationship keys unless their preservation properties are
    documented.
keys:
  accession_identifier:
    key_type: natural
    uniqueness: unique
    completeness: complete
    evidence: [release_schema, cross_table_check]
    caveats:
      - This is a release-verified locator, not a documented cross-profile database constraint.
    columns: [acc_anon]
  patient_accession:
    key_type: natural
    uniqueness: unique
    completeness: complete
    evidence: [release_schema, cross_table_check]
    caveats:
      - >-
        The composite is redundant because the accession identifier is itself unique; it is
        retained for a directly checked wide-table relationship.
    columns: [empi_anon, acc_anon]
  patient_identifier:
    key_type: natural
    uniqueness: not_unique
    completeness: complete
    evidence: [release_schema, observed_source_values]
    caveats:
      - A patient may be represented by multiple exam rows.
    columns: [empi_anon]
objects:
  imaging_exam:
    authority: preferred
    derivation: source
    caveats:
      - The expected accession identity is release scoped.
    object: imaging_exam
    columns: [acc_anon]
columns:
  empi_anon:
    type: int64
    nullable: true
    maps:
      - {id: identity.patient_identifier, mapping: direct}
  studydate_anon:
    type: timestamp[ns]
    nullable: true
    maps:
      - {id: exam.study_date, mapping: direct}
  acc_anon:
    type: int64
    nullable: true
    maps:
      - {id: exam.accession_identifier, mapping: direct}
  desc:
    type: string
    nullable: true
    maps:
      - {id: exam.procedure_description, mapping: direct}
  modality_desc:
    type: string
    nullable: true
    maps:
      - {id: exam.modality, mapping: direct, vocabulary: open-v2.codes.exam-modality}
  loc_num_anon:
    type: string
    nullable: true
    maps:
      - {id: exam.location, mapping: direct, vocabulary: open-v2.codes.exam-location}
  mg_exam_type:
    type: string
    nullable: true
    maps:
      - id: exam.mammography_type
        mapping: direct
        vocabulary: open-v2.codes.exam-mammography-type
  tissueden:
    type: int8
    nullable: true
    maps:
      - id: exam.tissue_density
        mapping: direct
        vocabulary: open-v2.codes.exam-tissue-density
  ASHKENAZI:
    type: string
    nullable: true
    maps:
      - {id: demographics.ashkenazi_indicator, mapping: direct}
  age_at_study_anon:
    type: int16
    nullable: true
    maps:
      - {id: demographics.age_at_exam, mapping: direct}
  menopauseage_anon:
    type: int16
    nullable: true
    maps:
      - {id: demographics.age_at_menopause, mapping: direct}
  pregnancyage_anon:
    type: int16
    nullable: true
    maps:
      - {id: demographics.age_at_pregnancy, mapping: direct}
  menarcheage_anon:
    type: int16
    nullable: true
    maps:
      - {id: demographics.age_at_menarche, mapping: direct}
  proc_flag:
    type: string
    nullable: true
    maps:
      - {id: exam.procedure_related_flag, mapping: direct}
  biopsy_flag:
    type: string
    nullable: true
    maps:
      - {id: exam.biopsy_related_flag, mapping: direct}
  extract_flag:
    type: string
    nullable: true
    maps:
      - {id: exam.extraction_eligibility_flag, mapping: direct}
  path_severity_exam_level:
    type: int8
    nullable: true
    maps:
      - id: exam.pathology_severity_aggregate
        mapping: direct
        vocabulary: open-v2.codes.pathology-severity
  mass_exam_level:
    type: int8
    nullable: true
    maps:
      - {id: exam.mass_aggregate, mapping: direct}
  asymmetry_exam_level:
    type: int8
    nullable: true
    maps:
      - {id: exam.asymmetry_aggregate, mapping: direct}
  arch_distortion_exam_level:
    type: int8
    nullable: true
    maps:
      - {id: exam.architectural_distortion_aggregate, mapping: direct}
  calc_exam_level:
    type: int8
    nullable: true
    maps:
      - {id: exam.calcification_aggregate, mapping: direct}
  vtype:
    type: string
    nullable: true
    maps:
      - {id: exam.visit_type, mapping: direct, vocabulary: open-v2.codes.exam-visit-type}
  version:
    type: int8
    nullable: true
    maps:
      - id: exam.release_version
        mapping: direct
        vocabulary: open-v2.codes.exam-release-version
