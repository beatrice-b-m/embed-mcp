kind: table
label: imaging_findings_anon
grain: imaging_finding
caveats:
  - No documented natural key uniquely identifies every imaging-finding row.
keys:
  finding_tuple:
    key_type: natural
    uniqueness: not_unique
    completeness: incomplete
    evidence: [release_schema, cross_table_check]
    caveats:
      - >-
        The apparent accession, side, and finding tuple is incomplete and does not uniquely
        identify every imaging row.
      - Null side and sentinel-like finding numbers require explicit handling.
    columns: [acc_anon, side, numfind]
  export_index:
    key_type: technical
    uniqueness: unique
    completeness: complete
    evidence: [release_schema, cross_table_check]
    caveats:
      - >-
        The pandas serialization index is release-local provenance, not a clinical or
        cross-release key.
    columns: [__index_level_0__]
objects:
  breast_imaging_episode:
    authority: reference
    caveats:
      - No complete episode identity or construction rule is established.
    object: breast_imaging_episode
    cites:
      - open-v2.linked-exam-context#optional-reference
      - open-v2.linked-exam-context#link-meaning
    columns: [acc_anon, linkedaccession_anon]
  imaging_finding:
    authority: preferred
    derivation: source
    identity_scope: >-
      Distinct clinical finding within one accession after excluding reserved synthetic entries.
    rows_per_instance: one_or_more
    longitudinal_identity: false
    caveats:
      - The clinical identity omits side and may occupy multiple physical rows.
    object: imaging_finding
    cites:
      - open-v2.multimodal-finding-context#descriptor-families
      - open-v2.multimodal-finding-context#synthetic-contralateral-finding
    columns: [acc_anon, side, numfind]
    identity_columns: [acc_anon, numfind]
    reserved_exceptions:
      numfind=-9:
        representation: "-9"
        meaning: >-
          Derived synthetic contralateral negative finding rather than an ordinary clinical
          finding identity.
        caveats:
          - Exclude this reserved value when identifying ordinary distinct clinical findings.
        column: numfind
        cites:
          - open-v2.multimodal-finding-context#synthetic-contralateral-finding
  imaging_interpretation:
    caveats:
      - No independent interpretation row identity or timestamp exists.
    object: imaging_interpretation
    cites:
      - open-v2.assessment-recommendation-context#separate-fields
    columns: [asses, recc]
columns:
  acc_anon:
    type: int64
    nullable: true
    maps:
      - {id: exam.accession_identifier, mapping: direct}
  linkedaccession_anon:
    type: int64
    nullable: true
    maps:
      - {id: imaging.linked_accession_identifier, mapping: direct}
  linked_study_flag:
    type: string
    nullable: true
