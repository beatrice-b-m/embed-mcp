  side:
    type: string
    nullable: true
    maps:
      - {id: breast.side, mapping: direct, vocabulary: open-v2.codes.breast-side}
    interpretations:
      "null":
        representation: "null"
        meaning: The clinical imaging finding is bilateral.
        status: verified
        caveats:
          - This bilateral meaning is specific to finding-side laterality.
        cites:
          - open-v2.multimodal-finding-context#finding-side-null
