kind: table
label: risk_anon
grain: risk_assessment
caveats:
  - >-
    Risk-to-exam referential coverage remains unresolved; risk scores were calculated during
    clinical care and extracted from MagView.
keys:
  accession_identifier:
    key_type: natural
    uniqueness: unique
    completeness: complete
    evidence: [release_schema, observed_source_values]
    caveats:
      - >-
        Open-v2 has at most one represented risk row per accession, but no durable uniqueness
        constraint is documented.
    columns: [acc_anon]
  patient_identifier:
    key_type: natural
    uniqueness: not_unique
    completeness: complete
    evidence: [release_schema, observed_source_values]
    caveats:
      - A patient may have risk rows for multiple accessions.
    columns: [empi_anon]
  export_index:
    key_type: technical
    uniqueness: unknown
    completeness: complete
    evidence: [release_schema]
    caveats:
      - >-
        Parquet metadata identifies a pandas index; its uniqueness and stability were not
        established for relationship use.
    columns: [__index_level_0__]
objects:
  risk_assessment:
    authority: preferred
    derivation: source
    caveats:
      - Several risk-field definitions and sentinel meanings remain unresolved.
    object: risk_assessment
    cites:
      - open-v2.risk-context#separate-risk-surface
    columns: [empi_anon, acc_anon]
columns:
  empi_anon:
    type: int64
    nullable: true
    maps:
      - {id: identity.patient_identifier, mapping: direct}
  acc_anon:
    type: int64
    nullable: true
    maps:
      - {id: exam.accession_identifier, mapping: direct}
  studydate_anon:
    type: timestamp[ns]
    nullable: true
    maps:
      - {id: exam.study_date, mapping: direct}
  NCILIFE:
    type: double
    nullable: true
    maps:
      - {id: risk.nci_lifetime, mapping: direct}
    interpretations:
      "-35":
        representation: "-35"
        meaning: >-
          Exceptional value with unresolved meaning; it is not validated as a probability-like
          prediction.
        status: unresolved
        caveats:
          - Exclude or otherwise handle only under a declared policy after validation.
        cites: [open-v2.risk-context#risk-semantics]
      "-2":
        representation: "-2"
        meaning: >-
          Exceptional value with unresolved meaning; it is not validated as a probability-like
          prediction.
        status: unresolved
        caveats:
          - Exclude or otherwise handle only under a declared policy after validation.
        cites: [open-v2.risk-context#risk-semantics]
      "100":
        representation: "100"
        meaning: >-
          Exceptional or boundary value with unresolved meaning; it is not validated as a
          probability-like prediction.
        status: unresolved
        caveats:
          - Do not assume this is a valid 100-percent probability.
        cites: [open-v2.risk-context#risk-semantics]
