kind: vocabulary
label: Pathology finding codes
completeness: unknown
null_meaning: [undocumented]
parsing: shared_slot_dictionary
evidence: [release_legend, maintainer_confirmed]
caveats:
  - >-
    All observed source-system codes are valid, but codes absent from the release legend retain
    unknown mappings pending internal investigation.
  - >-
    The shared dictionary applies to procedure-associated path1 through path10 slots; slot
    position and duplicate occurrences are not decision-making signals.
