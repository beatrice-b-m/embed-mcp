label: Changing clinical grain requires an explicit aggregation policy
category: analyst_choice
priority: high
statement: >-
  Moving among finding, side, exam, episode, and patient grain requires a declared aggregation,
  multiplicity, and time policy.
rationale: >-
  The same person can have multiple exams, sides, findings, procedures, and diagnoses; supplied
  aggregates cover only documented transitions.
