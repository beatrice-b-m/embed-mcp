kind: clinical_object
label: Breast side
definition: >-
  A left- or right-breast view of an exam used for laterality-specific findings and aggregates.
grain: one breast side within an exam
search_terms: [breast side, laterality, left breast, right breast]
caveats:
  - >-
    A null side on a finding can represent bilateral involvement, while null procedure side
    generally means unknown.
  - >-
    Null laterality has no single meaning across fields; interpret it by each field's clinical
    role.
topics: [topic.breast_side, topic.exam, topic.imaging]
