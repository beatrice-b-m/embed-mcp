# Physical representation --------------------------------------------------

maps:
  owners: [column]
  targets: [feature]
  backlink: columns
  description: Features this column records, one entry per mapping.
  qualifiers:
    mapping: {type: value, of: mapping_statuses, required: true}
    vocabulary:
      type: link
      targets: [vocabulary]
      backlink: mappings
      description: The code list this mapping uses.
    notes: {type: text, many: true}
    slot:
      type: text
      description: Physical slot position among repeated columns; semantic ordering is unresolved.
    role:
      type: text
      description: Which of several objects co-located in the row the value describes.
    attribute:
      type: text
      description: The attribute of the feature this column records.
    source_attribute:
      type: text
      description: The source-system attribute name the column carries.
    axis:
      type: text
      description: The dimension of a multi-dimensional feature this column records.
    direction:
      type: text
      description: The direction of a directional measurement this column records.
    category_column:
      type: text
      description: The column in this table whose value selects this mapping.
    category_value:
      type: text
      description: The value of the category column for which this mapping applies.
    subject_column:
      type: text
      description: The column in this table that identifies whom the value describes.
    subject_value:
      type: text
      description: The value of the subject column for which this mapping applies.
    locator_component:
      type: text
      description: Which part of a file locator this column records.
    accession_role:
      type: text
      description: Which accession of several this column records.
    composite_with:
      type: text
      description: A column in this table that must be combined with this one to form the value.

interpretation_feature:
  field: feature
  owners: [interpretation]
  targets: [feature]
  many: false
  backlink: interpretations
  description: The mapped feature this interpretation belongs to, when the column maps to several.

key_columns:
  field: columns
  owners: [key]
  targets: [column]
  local: true
  required: true
  backlink: keys

object:
  owners: [object_binding]
  targets: [clinical_object]
  many: false
  required: true
  backlink: represented_by

object_columns:
  field: columns
  owners: [object_binding]
  targets: [column]
  local: true
  backlink: represents

identity_columns:
  owners: [object_binding]
  targets: [column]
  local: true
  backlink: identifies

exception_column:
  field: column
  owners: [reserved_exception]
  targets: [column]
  local: true
  many: false
  required: true
  backlink: reserved_exceptions

join_relationships:
  field: relationships
  owners: [join]
  targets: [relationship]
  required: true
  backlink: joins
  description: Clinical relationships this join represents.

source_columns:
  owners: [join]
  targets: [column]
  required: true
  backlink: joins_from

target_columns:
  owners: [join]
  targets: [column]
  required: true
  backlink: joins_to

path_relationship:
  field: relationship
  owners: [join_path]
  targets: [relationship]
  many: false
  required: true
  backlink: join_paths

path_joins:
  field: joins
  owners: [join_path]
  targets: [join]
  required: true
  backlink: paths
  description: The joins in traversal order.

subject:
  owners: [profile_support]
  targets: [clinical_object, concept, feature, relationship, temporal, aggregation, guardrail, context]
  many: false
  required: true
  backlink: profile_support

evidence_cites:
  owners: [profile_support]
  targets: [claim]
  backlink: cited_by
