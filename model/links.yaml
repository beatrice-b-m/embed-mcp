  targets: [concept]
  backlink: narrower
  acyclic: true
  description: More general concepts; a concept may have several.

objects:
  owners: [feature]
  targets: [clinical_object]
  backlink: features
  description: Clinical objects this feature describes.

feature_concepts:
  field: concepts
  owners: [feature]
  targets: [concept]
  backlink: features
  description: Clinical concepts this feature represents.

feature_temporal:
  field: temporal
  owners: [feature]
  targets: [temporal]
  backlink: features
  description: Time meanings this feature records or depends on.

temporal_objects:
  field: objects
  owners: [temporal]
  targets: [clinical_object]
  backlink: temporal_meanings
  description: Clinical objects whose events this time meaning describes.

relative_to:
  owners: [temporal]
  targets: [temporal]
  acyclic: true
  backlink: anchor_for

source_object:
  owners: [relationship, aggregation]
  targets: [clinical_object]
  many: false
  required: true
  backlink: source_of

target_object:
  owners: [relationship, aggregation]
  targets: [clinical_object]
  many: false
  required: true
  backlink: target_of

relationship_temporal:
  field: temporal
  owners: [relationship]
  targets: [temporal]
  backlink: relationships

input_feature:
  owners: [aggregation]
  targets: [feature]
  many: false
  required: true
  backlink: aggregated_by

result_feature:
  owners: [aggregation]
  targets: [feature]
  many: false
  backlink: result_of

via:
  owners: [aggregation]
  targets: [relationship]
  backlink: aggregations
  description: Relationships the aggregation combines across.

applies_to:
  owners: [guardrail]
  targets: [clinical_object, concept, feature, relationship, temporal, aggregation, profile_support, table, column]
