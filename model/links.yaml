# Link types between documents.
#
# A link is written only in the owning document, under `field:` (which
# defaults to the link type's name). The engine computes the reverse link and
# shows it on the target under `backlink:`. Writing a link from the target's
# side is an error.
#
#   owners      kinds whose documents (or entries) write this link
#   targets     kinds the link may point to; `any` allows every kind
#   many        a list of links (default true); false for a single link
#   required    the owner must write at least one link of this type
#   acyclic     following this link type may never lead back to the start
#   symmetric   shown under the same name from both ends
#   local       bare values name entries in the same document,
#               so `acc_anon` means `<this-document>#acc_anon`
#   qualifiers  extra fields a link may carry; a link then takes the form
#               `{id: <target>, <qualifier>: ...}`. A qualifier of
#               `type: link` is itself a link, with its own `targets` and
#               `backlink`.
#
# Every link may also be written as `{id: <target>, note: <text>}` to explain
# why the link exists.

# Organization and provenance ----------------------------------------------

topics:
  owners: [clinical_object, concept, feature, relationship, temporal, aggregation, guardrail, pattern, context, profile_support]
  targets: [topic]
  backlink: members
  description: Hub documents this document belongs under.

topic_broader:
  field: broader
  owners: [topic]
  targets: [topic]
  backlink: narrower
  acyclic: true

related:
  owners: any
  targets: any
  symmetric: true
  backlink: related
  description: An association without a more specific link type.

cites:
  owners: [clinical_object, concept, feature, relationship, temporal, aggregation, guardrail, pattern, context, missing_state, interpretation, object_binding, reserved_exception, join, join_path]
  targets: [claim]
  backlink: cited_by
  description: Claims that support this document.

claim_sources:
  field: sources
  owners: [claim]
  targets: [source]
  backlink: supports
  required: true

step_claims:
  field: claims
  owners: [workflow_step]
  targets: [claim]
  local: true
  backlink: steps

